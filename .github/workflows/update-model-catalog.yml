name: Update Model Catalog

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual triggering

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Job 1: Update the LLM catalog (model_catalog.json, GGUF only)
  update-v1:
    runs-on: ubuntu-latest
    outputs:
      new_models: ${{ steps.extract-summary.outputs.new_models }}
      total_models: ${{ steps.extract-summary.outputs.total_models }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_SERVICE_ACCOUNT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run model catalog V1 update script
        env:
          API_KEY: ${{ secrets.API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          python prepare_catalog.py | tee script_output.log
        timeout-minutes: 90

      - name: Extract summary from script output
        id: extract-summary
        run: |
          SUMMARY_LINE=$(tail -n 1 script_output.log)
          NEW_MODELS=$(echo "$SUMMARY_LINE" | grep -oP 'Added \K[0-9]+' || echo "0")
          TOTAL_MODELS=$(echo "$SUMMARY_LINE" | grep -oP 'total now \K[0-9]+' || echo "0")
          echo "new_models=$NEW_MODELS" >> $GITHUB_OUTPUT
          echo "total_models=$TOTAL_MODELS" >> $GITHUB_OUTPUT

      - name: Upload V1 catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-v1
          path: |
            model_catalog.json
            script_output.log

  # Job 2: Update whisper catalog
  update-whisper:
    runs-on: ubuntu-latest
    outputs:
      new_models: ${{ steps.extract-summary.outputs.new_models }}
      total_models: ${{ steps.extract-summary.outputs.total_models }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_SERVICE_ACCOUNT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Update whisper catalog update script
        env:
          API_KEY: ${{ secrets.API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          python prepare_whisper_catalog.py | tee script_output_whisper.log
        timeout-minutes: 30

      - name: Extract summary from script output
        id: extract-summary
        run: |
          SUMMARY_LINE=$(tail -n 1 script_output_whisper.log)
          NEW_MODELS=$(echo "$SUMMARY_LINE" | grep -oP 'Added \K[0-9]+' || echo "0")
          TOTAL_MODELS=$(echo "$SUMMARY_LINE" | grep -oP 'total now \K[0-9]+' || echo "0")
          echo "new_models=$NEW_MODELS" >> $GITHUB_OUTPUT
          echo "total_models=$TOTAL_MODELS" >> $GITHUB_OUTPUT

      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-whisper
          path: |
            whisper_catalog.json
            script_output_whisper.log

  # Job 3: Update embedding catalog
  update-embedding:
    runs-on: ubuntu-latest
    outputs:
      new_models: ${{ steps.extract-summary.outputs.new_models }}
      total_models: ${{ steps.extract-summary.outputs.total_models }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_SERVICE_ACCOUNT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Update embedding catalog update script
        env:
          API_KEY: ${{ secrets.API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          python prepare_embedding_catalog.py | tee script_output_embedding.log
        timeout-minutes: 30

      - name: Extract summary from script output
        id: extract-summary
        run: |
          SUMMARY_LINE=$(tail -n 1 script_output_embedding.log)
          NEW_MODELS=$(echo "$SUMMARY_LINE" | grep -oP 'Added \K[0-9]+' || echo "0")
          TOTAL_MODELS=$(echo "$SUMMARY_LINE" | grep -oP 'total now \K[0-9]+' || echo "0")
          echo "new_models=$NEW_MODELS" >> $GITHUB_OUTPUT
          echo "total_models=$TOTAL_MODELS" >> $GITHUB_OUTPUT

      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-embedding
          path: |
            embedding_catalog.json
            script_output_embedding.log

  # Job 4: Create PR after all jobs complete
  create-pr:
    runs-on: ubuntu-latest
    needs: [update-v1, update-whisper, update-embedding]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_SERVICE_ACCOUNT }}
          fetch-depth: 0

      - name: Download LLM catalog artifact
        uses: actions/download-artifact@v4
        with:
          name: catalog-v1

      - name: Download whisper catalog artifact
        uses: actions/download-artifact@v4
        with:
          name: catalog-whisper

      - name: Download embedding catalog artifact
        uses: actions/download-artifact@v4
        with:
          name: catalog-embedding

      - name: Set date variables
        id: date
        run: |
          echo "today=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "today_with_time=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          echo "today_readable=$(date +'%d-%m-%Y')" >> $GITHUB_OUTPUT
          echo "datetime=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          echo "datetime_short=$(date +'%d-%m-%Y %H:%M')" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          base: main
          token: ${{ secrets.PAT_SERVICE_ACCOUNT }}
          branch: update-model-catalog-${{ steps.date.outputs.today_with_time }}
          commit-message: "🤖 Auto-update model catalog - ${{ steps.date.outputs.datetime }}"
          title: "🤖 Auto-update Model Catalog - ${{ steps.date.outputs.datetime_short }}"
          body: |
            ## 🤖 Automated Model Catalog Update
            ### **Date:** ${{ steps.date.outputs.datetime_short }}
            ### LLM catalog (model_catalog.json)
            - **New models added:** ${{ needs.update-v1.outputs.new_models }}
            - **Total models:** ${{ needs.update-v1.outputs.total_models }}
            ### Whisper catalog (whisper_catalog.json)
            - **Total repos:** ${{ needs.update-whisper.outputs.total_models }}
            ### Embedding catalog (embedding_catalog.json)
            - **Total models:** ${{ needs.update-embedding.outputs.total_models }}
